name: Blender CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project structure
        shell: bash
        run: |
          test -f AGENTS.md
          test -f .gitignore
          test -d blend
          test -d scripts
          test -f scripts/verify_simple_desk.py

      - name: Validate Python syntax
        shell: bash
        run: |
          python -m py_compile scripts/*.py

      - name: CI structure check
        run: echo "Project structure and Python syntax checks passed."